id: jaffle_shop_insights_kestra_hackathon_ai
namespace: kestra.devrel


description: |
  Kestra hackathon starter flow (AI track): Jaffle Shop AI briefing.

  The flow crunches the latest Jaffle Shop sales with DuckDB, then asks an AI model
  (Google Gemini) to act as a business analyst. The model returns:
    - a written briefing for the store managers, in the language you choose,
    - a structured verdict: which store needs attention and how urgent it is.
  Kestra then uses that verdict to decide what to do next (a raised alert or a routine log).

  ONE-TIME SETUP (about 2 minutes, free):
    1. Get a free Gemini API key at https://aistudio.google.com/apikey
    2. In Kestra, open Namespaces > yourNamespce.Name > KV Store > Create
       Key: GEMINI_API_KEY    Type: STRING    Value: <your key>
    3. Click Execute.

  Note: the KV Store keeps values in plain text, which is fine for a hackathon.
  In production, store API keys as Kestra secrets instead.

labels:
  event: hackathon
  dataset: jaffle-shop
  track: ai

inputs:
  - id: period_days
    type: INT
    displayName: Length of the period to analyze, in days
    description: The latest N days of data are compared with the N days before them.
    defaults: 28
    min: 7
    max: 180

  - id: language
    type: SELECT
    displayName: Language of the briefing
    values:
      - English
      - French
      - German
      - Spanish
      - Portuguese
    defaults: English

variables:
  data_url: https://huggingface.co/datasets/annageller/kestra/resolve/main/jaffle-data
  # Change the model here if needed. Flash-Lite models are fast and cheap.
  gemini_model: gemini-3.5-flash-lite

tasks:
  # ---------------------------------------------------------------------------
  # STEP 0 - CHECK SETUP: stop early with a clear message if the API key is missing.
  # ---------------------------------------------------------------------------
  - id: check_api_key
    type: io.kestra.plugin.core.execution.Fail
    condition: "{{ kv('GEMINI_API_KEY', errorOnMissing=false) is null }}"
    errorMessage: >
      No GEMINI_API_KEY found in the KV Store of namespace {{ flow.namespace }}.
      Get a free key at https://aistudio.google.com/apikey, add it under
      Namespaces > {{ flow.namespace }} > KV Store, then run the flow again.

  # ---------------------------------------------------------------------------
  # STEP 1 - EXTRACT: download the raw data.
  # ---------------------------------------------------------------------------
  - id: download_orders
    type: io.kestra.plugin.core.http.Download
    uri: "{{ vars.data_url }}/raw_orders.csv"

  - id: download_stores
    type: io.kestra.plugin.core.http.Download
    uri: "{{ vars.data_url }}/raw_stores.csv"

  - id: download_items
    type: io.kestra.plugin.core.http.Download
    uri: "{{ vars.data_url }}/raw_items.csv"

  - id: download_products
    type: io.kestra.plugin.core.http.Download
    uri: "{{ vars.data_url }}/raw_products.csv"

  # ---------------------------------------------------------------------------
  # STEP 2 - PREPARE: compute the numbers the AI will reason about.
  # LLMs are bad at crunching hundreds of thousands of rows, so we do the math
  # in SQL and only send a small summary to the model.
  # ---------------------------------------------------------------------------
  - id: store_kpis
    type: io.kestra.plugin.jdbc.duckdb.Query
    inputFiles:
      orders.csv: "{{ outputs.download_orders.uri }}"
      stores.csv: "{{ outputs.download_stores.uri }}"
    sql: |
      WITH orders AS (
        SELECT * FROM read_csv_auto('{{ workingDir }}/orders.csv')
      ),
      bounds AS (
        SELECT MAX(ordered_at)::DATE AS end_date FROM orders
      ),
      tagged AS (
        SELECT
          o.*,
          b.end_date,
          CASE
            WHEN o.ordered_at::DATE > b.end_date - {{ inputs.period_days }}     THEN 'current'
            WHEN o.ordered_at::DATE > b.end_date - {{ inputs.period_days * 2 }} THEN 'previous'
          END AS period
        FROM orders o, bounds b
      )
      SELECT
        s.name                                                                   AS store,
        MAX(t.end_date)::VARCHAR                                                 AS period_end,
        COUNT(*) FILTER (WHERE period = 'current')                               AS orders_current,
        COUNT(*) FILTER (WHERE period = 'previous')                              AS orders_previous,
        ROUND(SUM(order_total) FILTER (WHERE period = 'current')  / 100.0, 2)    AS revenue_current_usd,
        ROUND(SUM(order_total) FILTER (WHERE period = 'previous') / 100.0, 2)    AS revenue_previous_usd,
        ROUND(100.0 * (SUM(order_total) FILTER (WHERE period = 'current')
                     - SUM(order_total) FILTER (WHERE period = 'previous'))
                    / NULLIF(SUM(order_total) FILTER (WHERE period = 'previous'), 0), 1)
                                                                                 AS revenue_change_pct,
        ROUND(AVG(order_total) FILTER (WHERE period = 'current') / 100.0, 2)     AS avg_order_current_usd,
        MODE(DAYNAME(ordered_at)) FILTER (WHERE period = 'current')              AS busiest_weekday
      FROM tagged t
      JOIN read_csv_auto('{{ workingDir }}/stores.csv') s ON t.store_id = s.id
      WHERE period IS NOT NULL
      GROUP BY s.name
      ORDER BY revenue_current_usd DESC NULLS LAST
    fetchType: FETCH

  - id: product_trends
    type: io.kestra.plugin.jdbc.duckdb.Query
    inputFiles:
      orders.csv: "{{ outputs.download_orders.uri }}"
      items.csv: "{{ outputs.download_items.uri }}"
      products.csv: "{{ outputs.download_products.uri }}"
    sql: |
      WITH orders AS (
        SELECT id, ordered_at FROM read_csv_auto('{{ workingDir }}/orders.csv')
      ),
      bounds AS (
        SELECT MAX(ordered_at)::DATE AS end_date FROM orders
      ),
      sold AS (
        SELECT
          i.sku,
          CASE
            WHEN o.ordered_at::DATE > b.end_date - {{ inputs.period_days }}     THEN 'current'
            WHEN o.ordered_at::DATE > b.end_date - {{ inputs.period_days * 2 }} THEN 'previous'
          END AS period
        FROM read_csv_auto('{{ workingDir }}/items.csv') i
        JOIN orders o ON i.order_id = o.id
        CROSS JOIN bounds b
      )
      SELECT
        p.name                                          AS product,
        p.type                                          AS product_type,
        COUNT(*) FILTER (WHERE period = 'current')      AS units_current,
        COUNT(*) FILTER (WHERE period = 'previous')     AS units_previous
      FROM sold
      JOIN read_csv_auto('{{ workingDir }}/products.csv') p ON sold.sku = p.sku
      WHERE period IS NOT NULL
      GROUP BY p.name, p.type
      ORDER BY units_current DESC
    fetchType: FETCH

  # ---------------------------------------------------------------------------
  # STEP 3 - AI: ask Gemini to analyze the numbers.
  # `responseFormat: JSON` with a schema forces the model to answer in a fixed
  # structure, so later tasks can read fields like jsonOutput.alert_level.
  # ---------------------------------------------------------------------------
  - id: ai_analyst
    type: io.kestra.plugin.ai.completion.ChatCompletion
    provider:
      type: io.kestra.plugin.ai.provider.GoogleGemini
      apiKey: "{{ kv('GEMINI_API_KEY') }}"
      modelName: "{{ vars.gemini_model }}"
    configuration:
      temperature: 0.3
      responseFormat:
        type: JSON
        jsonSchema:
          type: object
          properties:
            headline:
              type: string
              description: One-sentence summary of the period.
            briefing_markdown:
              type: string
              description: Briefing for store managers in Markdown, 150 to 300 words.
            store_to_watch:
              type: string
              description: Name of the store that most needs attention.
            alert_level:
              type: string
              enum: [LOW, MEDIUM, HIGH]
            reason:
              type: string
              description: Why this store needs attention, citing numbers.
            recommended_actions:
              type: array
              items:
                type: string
          required: [headline, briefing_markdown, store_to_watch, alert_level, reason, recommended_actions]
    messages:
      - type: SYSTEM
        content: |
          You are a sharp, friendly business analyst for the Jaffle Shop, a chain of
          sandwich (jaffle) and coffee shops. Base every statement on the data you are
          given and quote concrete numbers. Do not invent data. Write in {{ inputs.language }}.
          Set alert_level to HIGH only if a store's revenue dropped more than 10%,
          MEDIUM for a drop between 3% and 10%, and LOW otherwise.
      - type: USER
        content: |
          Analyze the last {{ inputs.period_days }} days of sales (ending {{ outputs.store_kpis.rows[0].period_end }})
          compared with the {{ inputs.period_days }} days before.

          Store KPIs (JSON):
          {{ outputs.store_kpis.rows | toJson }}

          Units sold per product (JSON):
          {{ outputs.product_trends.rows | toJson }}

  # ---------------------------------------------------------------------------
  # STEP 4 - SAVE: write the briefing to a Markdown file (see the Outputs tab).
  # ---------------------------------------------------------------------------
  - id: save_briefing
    type: io.kestra.plugin.core.storage.Write
    extension: .md
    content: |
      # {{ outputs.ai_analyst.jsonOutput.headline }}

      {{ outputs.ai_analyst.jsonOutput.briefing_markdown }}

      ## Store to watch: {{ outputs.ai_analyst.jsonOutput.store_to_watch }} ({{ outputs.ai_analyst.jsonOutput.alert_level }})

      {{ outputs.ai_analyst.jsonOutput.reason }}

      ## Recommended actions
      {% for action in outputs.ai_analyst.jsonOutput.recommended_actions %}
      - {{ action }}
      {%- endfor %}

  # ---------------------------------------------------------------------------
  # STEP 5 - ACT: let the AI's verdict drive the flow.
  # In a real setup, the HIGH branch could send a Slack message or open a ticket.
  # ---------------------------------------------------------------------------
  - id: route_on_alert_level
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ai_analyst.jsonOutput.alert_level == 'HIGH' }}"
    then:
      - id: raise_alert
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: |
          ALERT: {{ outputs.ai_analyst.jsonOutput.store_to_watch }} needs attention.
          {{ outputs.ai_analyst.jsonOutput.reason }}
    else:
      - id: routine_update
        type: io.kestra.plugin.core.log.Log
        message: |
          Routine update ({{ outputs.ai_analyst.jsonOutput.alert_level }}): {{ outputs.ai_analyst.jsonOutput.headline }}
          Store to watch: {{ outputs.ai_analyst.jsonOutput.store_to_watch }}. {{ outputs.ai_analyst.jsonOutput.reason }}

outputs:
  - id: briefing
    type: FILE
    value: "{{ outputs.save_briefing.uri }}"

  - id: alert_level
    type: STRING
    value: "{{ outputs.ai_analyst.jsonOutput.alert_level }}"

# Disabled by default: set `disabled: false` to receive a briefing every Monday at 8:00.
triggers:
  - id: weekly_briefing
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * 1"
    disabled: true
